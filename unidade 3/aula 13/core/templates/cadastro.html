{% extends 'base.html' %}
{% load static %}

{% block conteudo_principal %}
<!-- GIF de fundo animado para manter a consistência -->
<img src="{% static 'videos/avedeto-night.gif' %}" alt="Motion Background" class="background-motion-video">
<div class="video-overlay"></div>

<div class="auth-container">
    <div class="auth-card">
        <a href="{% url 'landing' %}" class="auth-back-link">Voltar ao Início</a>
        <div style="text-align: center; margin: 8px 0 14px;">
            <img src="{% static 'images/artflow-logo.png' %}" alt="ArtFlow Logo" style="width: 58px; height: 58px; border-radius: 50%; box-shadow: 0 0 18px rgba(0, 255, 204, 0.45); object-fit: cover;">
        </div>
        <h2>CADASTRO</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-main-access">Criar Conta</button>
        </form>
        <p class="auth-redirect">Já tens uma conta? <a href="{% url 'login' %}">Faz login aqui</a></p>
    </div>
</div>
{% endblock conteudo_principal %}
